cargo-features = ["panic-immediate-abort"]

[package]
name = "super-user"
version = "0.0.0"
edition = "2024"

[[bin]]
name = "SuperUser"
path = "src/main.rs"

[profile.dev]
opt-level = "z"
strip = true
lto = true
panic = "immediate-abort"
codegen-units = 1

[profile.release]
opt-level = "z"
strip = true
lto = true
panic = "immediate-abort"
codegen-units = 1
