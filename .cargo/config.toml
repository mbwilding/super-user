[build]
target = "x86_64-pc-windows-msvc"

[target.x86_64-pc-windows-msvc]
rustflags = [
    "-Clink-arg=/NODEFAULTLIB",
    "-Clink-arg=/ENTRY:mainCRTStartup",
    "-Clink-arg=/SUBSYSTEM:WINDOWS",
    "-Clink-arg=/STUB:dos-stub.bin",
    "-Clink-arg=/IGNORE:4060",
    "-Clink-arg=/DEBUG:NONE",
    "-Clink-arg=/MERGE:.rdata=.text",
    "-Clink-arg=/MERGE:.pdata=.text",
]

[unstable]
build-std = ["core", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem", "optimize_for_size"]
