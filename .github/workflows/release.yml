name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: 0.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - run: (Get-Content Cargo.toml) -replace '^version = ".*"', 'version = "${{ env.VERSION }}"' | Set-Content Cargo.toml
      - run: cargo build --release
      - run: Compress-Archive target/x86_64-pc-windows-msvc/release/SuperUser.exe SuperUser-${{ env.VERSION }}.zip
      - run: gh release create v${{ env.VERSION }} SuperUser-${{ env.VERSION }}.zip --title v${{ env.VERSION }} --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
